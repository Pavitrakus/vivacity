services:
  - type: web
    name: vivacity-backend
    env: docker
    rootDir: backend
    plan: free
    region: oregon # or whichever is preferred
    healthCheckPath: /
    envVars:
      - key: PORT
        value: 8000
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_KEY
        sync: false
